<button class="btn-back" onclick="loadModule('home')">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span>Powrót do menu</span>
</button>

<div class="card">
    <div class="card-header">
        <div class="card-header-icon">
            <svg viewBox="0 0 24 24">
                <line x1="4" y1="6" x2="20" y2="6"/>
                <line x1="4" y1="12" x2="20" y2="12"/>
                <line x1="4" y1="18" x2="20" y2="18"/>
                <circle cx="8" cy="6" r="2"/>
                <circle cx="16" cy="12" r="2"/>
                <circle cx="10" cy="18" r="2"/>
            </svg>
        </div>
        <span class="card-title">Montaż szuflad w korpusie</span>
    </div>

    <div class="input-list">
        <!-- System prowadnic -->
        <div class="input-row">
            <div class="input-label">
                <span>System / Producent</span>
            </div>
            <select id="selAssemblySystem" onchange="calculateAssembly()" style="background: var(--input-bg); color: var(--text-primary); border: 1px solid var(--card-border); padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; outline: none; width: 55%;">
                <option value="rejs_ultrabox" selected>REJS - UltraBox</option>
                <option value="blum_antaro">BLUM - Antaro</option>
                <option value="blum_merivobox">BLUM - Merivobox</option>
                <option value="gtv_axispro">GTV - Axis Pro</option>
            </select>
        </div>

        <!-- Liczba frontów -->
        <div class="input-row">
            <div class="input-label">
                <span>Ilość frontów</span>
                <span class="input-sublabel">Liczba szuflad</span>
            </div>
            <div class="stepper">
                <button class="stepper-btn" onclick="stepAssemblyVal('inpFrontsCount', -1, 1)">-</button>
                <input type="number" id="inpFrontsCount" class="stepper-input" value="3" min="1" max="8" onfocus="this.select()" onclick="this.select()" oninput="renderAssemblyFrontInputs(); calculateAssembly();">
                <button class="stepper-btn" onclick="stepAssemblyVal('inpFrontsCount', 1, 1)">+</button>
            </div>
        </div>

        <!-- Szczelina między frontami -->
        <div class="input-row">
            <div class="input-label">
                <span>Szczelina między frontami</span>
                <span class="input-sublabel">Domyślnie mm</span>
            </div>
            <div class="stepper">
                <button class="stepper-btn" onclick="stepAssemblyVal('inpGapBetween', -0.5)">-</button>
                <input type="number" step="0.5" id="inpGapBetween" class="stepper-input" value="3" onfocus="this.select()" onclick="this.select()" oninput="calculateAssembly()">
                <button class="stepper-btn" onclick="stepAssemblyVal('inpGapBetween', 0.5)">+</button>
            </div>
        </div>

        <!-- Dynamiczne pola dla wysokości frontów (numery od dołu) -->
        <div style="margin-top: 10px; margin-bottom: 4px;">
            <span style="font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;">Wysokości frontów (od dołu do góry):</span>
        </div>
        <div id="frontsHeightInputsContainer" style="display: flex; flex-direction: column-reverse; gap: 10px;">
            <!-- Generowane dynamicznie przez JS -->
        </div>
    </div>
</div>

<!-- WYNIKI TRASOWANIA PROWADNIC -->
<div class="card">
    <div class="card-header">
        <div class="card-header-icon">
            <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        </div>
        <span class="card-title">Pozycja wkrętów (od dołu wieńca)</span>
    </div>

    <div class="list-table" id="runnerPositionsContainer">
        <!-- Wyniki pozycji prowadnic -->
    </div>
</div>
