<button class="btn-back" onclick="loadModule('home')">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span>Powrót do menu</span>
</button>

<div class="card">
    <div class="card-header">
        <div class="card-header-icon">
            <svg viewBox="0 0 24 24">
                <rect x="4" y="2" width="16" height="20" rx="2"/>
                <line x1="8" y1="6" x2="16" y2="6"/>
                <line x1="16" y1="14" x2="16" y2="18"/>
                <path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M8 18h.01M12 18h.01"/>
            </svg>
        </div>
        <span class="card-title">Kalkulator stolarski</span>
    </div>

    <!-- Wyświetlacz Kalkulatora -->
    <div class="calc-display-container">
        <div id="calcHistory" class="calc-history"></div>
        <div id="calcDisplay" class="calc-display">0</div>
    </div>

    <!-- Klawiatura Kalkulatora -->
    <div class="calc-grid">
        <button class="calc-btn btn-func" onclick="calcClear()">C</button>
        <button class="calc-btn btn-func" onclick="calcBackspace()">⌫</button>
        <button class="calc-btn btn-op" onclick="calcOp('%')">%</button>
        <button class="calc-btn btn-op" onclick="calcOp('/')">÷</button>

        <button class="calc-btn" onclick="calcNum('7')">7</button>
        <button class="calc-btn" onclick="calcNum('8')">8</button>
        <button class="calc-btn" onclick="calcNum('9')">9</button>
        <button class="calc-btn btn-op" onclick="calcOp('*')">×</button>

        <button class="calc-btn" onclick="calcNum('4')">4</button>
        <button class="calc-btn" onclick="calcNum('5')">5</button>
        <button class="calc-btn" onclick="calcNum('6')">6</button>
        <button class="calc-btn btn-op" onclick="calcOp('-')">-</button>

        <button class="calc-btn" onclick="calcNum('1')">1</button>
        <button class="calc-btn" onclick="calcNum('2')">2</button>
        <button class="calc-btn" onclick="calcNum('3')">3</button>
        <button class="calc-btn btn-op" onclick="calcOp('+')">+</button>

        <button class="calc-btn btn-zero" onclick="calcNum('0')">0</button>
        <button class="calc-btn" onclick="calcDot()">.</button>
        <button class="calc-btn btn-equals" onclick="calcEquals()">=</button>
    </div>
</div>
