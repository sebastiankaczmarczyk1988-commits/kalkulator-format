<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FOR.MAT - Asystent stolarza</title>
    
    <!-- PWA & Ikony -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#121214" id="theme-color-meta">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FOR.MAT">

    <!-- Czcionka Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Styl Aplikacji -->
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <!-- Górny Nagłówek -->
    <header>
        <div class="header-spacer"></div>
        <div class="brand-logo-container" onclick="loadModule('home')">
            <img id="mainLogo" src="logo-white.png" alt="FOR.MAT" class="app-logo">
        </div>
        <button class="theme-toggle" id="themeBtn" title="Zmień motyw">
            <svg id="themeIcon" viewBox="0 0 24 24"></svg>
        </button>
    </header>

    <!-- Główny Kontener -->
    <main>

        <!-- EKRAN STARTOWY (DASHBOARD) -->
        <div id="homePage" class="page active">
            <div class="section-header">
                <h1 class="section-title">Kalkulatory stolarskie</h1>
                <p class="section-subtitle">Wybierz narzędzie do szybkich przeliczeń</p>
            </div>

            <div class="menu-grid">
                <!-- Półki -->
                <div class="menu-card" onclick="loadModule('shelves')">
                    <div class="menu-card-icon">
                        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
                    </div>
                    <div class="menu-card-info">
                        <span class="menu-card-title">Rozstaw półek</span>
                        <span class="menu-card-desc">Światło i trasowanie otworów</span>
                    </div>
                </div>

                <!-- Szuflady -->
                <div class="menu-card" onclick="loadModule('drawers')">
                    <div class="menu-card-icon">
                        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18M10 8h4M10 16h4"/></svg>
                    </div>
                    <div class="menu-card-info">
                        <span class="menu-card-title">Szuflady</span>
                        <span class="menu-card-desc">Rozpiska formatek i dna</span>
                    </div>
                </div>

                <!-- Zawiasy -->
                <div class="menu-card" onclick="loadModule('hinges')">
                    <div class="menu-card-icon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 12h6M15 12h6M12 3v6M12 15v6"/></svg>
                    </div>
                    <div class="menu-card-info">
                        <span class="menu-card-title">Zawiasy</span>
                        <span class="menu-card-desc">Puszki i pozycje prowadników</span>
                    </div>
                </div>

                <!-- Kratki Wentylacyjne -->
                <div class="menu-card" onclick="loadModule('ventilation')">
                    <div class="menu-card-icon">
                        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v16M12 4v16M16 4v16M4 8h16M4 12h16M4 16h16"/></svg>
                    </div>
                    <div class="menu-card-info">
                        <span class="menu-card-title">Kratki went.</span>
                        <span class="menu-card-desc">Frezowanie we frontach</span>
                    </div>
                </div>

                <!-- Szybki Kalkulator -->
                <div class="menu-card" style="grid-column: span 2;" onclick="loadModule('calculator')">
                    <div class="menu-card-icon">
                        <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M8 18h.01M12 18h.01"/></svg>
                    </div>
                    <div class="menu-card-info">
                        <span class="menu-card-title">Kalkulator stolarski</span>
                        <span class="menu-card-desc">Podział odcinków i szybkie przeliczenia mm</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- DYNAMICZNY KONTENER NA MODUŁY -->
        <div id="app-content"></div>

    </main>

    <!-- Dolna Nawigacja -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="loadModule('shelves')">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            <span>Półki</span>
        </button>
        <button class="nav-item" onclick="loadModule('drawers')">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18M10 8h4M10 16h4"/></svg>
            <span>Szuflady</span>
        </button>
        <button class="nav-item" onclick="loadModule('hinges')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 12h6M15 12h6M12 3v6M12 15v6"/></svg>
            <span>Zawiasy</span>
        </button>
        <button class="nav-item" onclick="loadModule('ventilation')">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v16M12 4v16M16 4v16M4 8h16M4 12h16M4 16h16"/></svg>
            <span>Kratki</span>
        </button>
        <button class="nav-item" onclick="loadModule('calculator')">
            <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M8 18h.01M12 18h.01"/></svg>
            <span>Kalkulator</span>
        </button>
    </nav>

    <!-- Główny Skrypt Nawigacji -->
    <script src="js/app.js"></script>
    <!-- Biblioteka do generowania PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
</html>
